<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DutyCalendar Support</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #94a3b8; line-height: 1.6; margin: 0 0 24px; }
    a.button {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
    }
    .email { margin-top: 20px; font-size: 14px; color: #64748b; }
    .email a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DutyCalendar Support</h1>
    <p>Need help, found a bug, or have a suggestion? Get in touch and we'll get back to you.</p>
    <a class="button" href="mailto:duty.calendar@outlook.com?subject=DutyCalendar%20Support">Email Support</a>
    <div class="email">or write to <a href="mailto:duty.calendar@outlook.com">duty.calendar@outlook.com</a></div>
  </div>
</body>
</html>
